<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Secure Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&display=swap"
          rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
          --bg: #080c10; --panel: #0d1117; --border: #1e3a2f;
          --glow: #00ff88; --glow-dim: rgba(0,255,136,0.15);
          --glow-mid: rgba(0,255,136,0.4); --text: #c8fae0;
          --muted: #3a6e55; --danger: #ff4466; --danger-dim: rgba(255,68,102,0.15);
        }
        body {
          background: var(--bg); color: var(--text);
          font-family: 'Share Tech Mono', monospace;
          min-height: 100vh; display: flex; align-items: center;
          justify-content: center; overflow: hidden; position: relative;
        }
        body::before {
          content: ''; position: fixed; inset: 0;
          background-image:
            linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
          background-size: 40px 40px; pointer-events: none;
        }
        body::after {
          content: ''; position: fixed; top: 50%; left: 50%;
          transform: translate(-50%, -50%); width: 600px; height: 600px;
          background: radial-gradient(circle, rgba(0,255,136,0.06) 0%, transparent 70%);
          pointer-events: none;
        }
        .panel {
          position: relative; width: 420px; background: var(--panel);
          border: 1px solid var(--border); padding: 48px 40px 44px;
          box-shadow: 0 0 0 1px rgba(0,255,136,0.05), 0 0 40px rgba(0,255,136,0.08),
            inset 0 1px 0 rgba(0,255,136,0.08);
          animation: fadeIn 0.6s ease both;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .panel::before, .panel::after {
          content: ''; position: absolute; width: 12px; height: 12px;
          border-color: var(--glow); border-style: solid;
        }
        .panel::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
        .panel::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
        .corner-tr, .corner-bl {
          position: absolute; width: 12px; height: 12px;
          border-color: var(--glow); border-style: solid;
        }
        .corner-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
        .corner-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
        .header { margin-bottom: 36px; text-align: center; }
        .header .sys-label { font-size: 10px; letter-spacing: 4px; color: var(--muted); text-transform: uppercase; margin-bottom: 12px; }
        .header h1 { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 3px; color: var(--glow); text-shadow: 0 0 20px var(--glow-mid); text-transform: uppercase; }
        .header .subtitle { font-size: 11px; color: var(--muted); margin-top: 6px; letter-spacing: 1px; }
        .divider { height: 1px; background: linear-gradient(90deg, transparent, var(--border), transparent); margin-bottom: 36px; }
        .field-label { font-size: 10px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
        .input-wrap { position: relative; margin-bottom: 24px; }
        .input-wrap::before { content: '//'; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }
        input[type="password"] {
          width: 100%; background: rgba(0,255,136,0.04); border: 1px solid var(--border);
          color: var(--glow); font-family: 'Share Tech Mono', monospace; font-size: 16px;
          letter-spacing: 4px; padding: 14px 14px 14px 40px; outline: none;
          transition: border-color 0.2s, box-shadow 0.2s, background 0.2s; caret-color: var(--glow);
        }
        input[type="password"]::placeholder { color: var(--muted); letter-spacing: 2px; font-size: 13px; }
        input[type="password"]:focus { border-color: var(--glow); background: rgba(0,255,136,0.07); box-shadow: 0 0 0 3px var(--glow-dim), inset 0 0 12px rgba(0,255,136,0.05); }
        button {
          width: 100%; padding: 14px; background: transparent; border: 1px solid var(--glow);
          color: var(--glow); font-family: 'Rajdhani', sans-serif; font-weight: 700;
          font-size: 15px; letter-spacing: 4px; text-transform: uppercase; cursor: pointer;
          position: relative; overflow: hidden; transition: color 0.25s, background 0.25s, box-shadow 0.25s;
        }
        button::before { content: ''; position: absolute; inset: 0; background: var(--glow); transform: translateX(-100%); transition: transform 0.3s ease; z-index: 0; }
        button:hover::before { transform: translateX(0); }
        button:hover { color: var(--bg); box-shadow: 0 0 24px var(--glow-mid); }
        button span { position: relative; z-index: 1; }
        button:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
        .status {
          margin-top: 20px; padding: 12px 14px; font-size: 12px; letter-spacing: 1.5px;
          border-left: 2px solid transparent; opacity: 0; transform: translateY(4px);
          transition: opacity 0.3s, transform 0.3s; min-height: 42px;
        }
        .status.show { opacity: 1; transform: translateY(0); }
        .status.error { border-color: var(--danger); background: var(--danger-dim); color: var(--danger); }
        .status.loading { border-color: var(--muted); background: rgba(58,110,85,0.1); color: var(--muted); }
        .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--glow); margin-right: 8px; vertical-align: middle; animation: pulse 1.4s infinite; box-shadow: 0 0 6px var(--glow); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
        .scanline { position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--glow), transparent); opacity: 0; animation: scan 4s ease-in-out infinite; }
        @keyframes scan { 0% { top: 0; opacity: 0; } 5% { opacity: 0.6; } 95% { opacity: 0.6; } 100% { top: 100%; opacity: 0; } }
        .footer-line { margin-top: 28px; font-size: 9px; letter-spacing: 2px; color: var(--muted); text-align: center; opacity: 0.6; }
    </style>
</head>
<body>

<div class="panel">
    <div class="scanline"></div>
    <div class="corner-tr"></div>
    <div class="corner-bl"></div>

    <div class="header">
        <div class="sys-label">System Access Control</div>
        <h1>Secure Entry</h1>
        <div class="subtitle"><span class="dot"></span>Authentication required</div>
    </div>

    <div class="divider"></div>

    <div class="field-label">Access Key</div>
    <div class="input-wrap">
        <input
                type="password"
                id="passwordInput"
                placeholder="enter password..."
                autocomplete="off"
                spellcheck="false"
        />
    </div>

    <button id="submitBtn" onclick="handleSubmit()">
        <span>Authenticate &rarr;</span>
    </button>

    <div class="status" id="status"></div>

    <div class="footer-line">POST &middot; /ui &middot; v1.0</div>
</div>

<script>
    const input    = document.getElementById('passwordInput');
    const btn      = document.getElementById('submitBtn');
    const statusEl = document.getElementById('status');

    input.addEventListener('keydown', e => {
        if (e.key === 'Enter') handleSubmit();
    });

    function setStatus(type, message) {
        statusEl.className = 'status ' + type + ' show';
        statusEl.textContent = message;
    }

    function handleSubmit() {
        const password = input.value.trim();

        if (!password) {
            setStatus('error', 'Password field cannot be empty.');
            input.focus();
            return;
        }

        setStatus('loading', 'Authenticating...');
        btn.disabled = true;

        // Standard form POST — lets Spring MVC return the ModelAndView  normally
        const form   = document.createElement('form');
        form.method  = 'POST';
        form.action  = '[[${action}]]';

        const hidden = document.createElement('input');
        hidden.type  = 'hidden';
        hidden.name  = 'password';
        hidden.value = password;

        form.appendChild(hidden);
        document.body.appendChild(form);
        form.submit();
    }
</script>

</body>
</html>
