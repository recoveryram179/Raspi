<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Access Denied</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&display=swap"
          rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
          --bg: #0c0608; --panel: #110a0d; --border: #3a1e24;
          --danger: #ff2244; --danger-dim: rgba(255,34,68,0.12);
          --danger-mid: rgba(255,34,68,0.4); --danger-glow: rgba(255,34,68,0.08);
          --text: #fac8d0; --muted: #6e3a44;
        }
        body {
          background: var(--bg); color: var(--text);
          font-family: 'Share Tech Mono', monospace;
          min-height: 100vh; display: flex; align-items: center;
          justify-content: center; overflow: hidden; position: relative;
        }

        /* Grid */
        body::before {
          content: ''; position: fixed; inset: 0;
          background-image:
            linear-gradient(rgba(255,34,68,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,34,68,0.03) 1px, transparent 1px);
          background-size: 40px 40px; pointer-events: none;
        }

        /* Center glow */
        body::after {
          content: ''; position: fixed; top: 50%; left: 50%;
          transform: translate(-50%, -50%); width: 700px; height: 700px;
          background: radial-gradient(circle, rgba(255,34,68,0.07) 0%, transparent 70%);
          pointer-events: none;
        }

        /* Flicker animation */
        @keyframes flicker {
          0%, 100% { opacity: 1; }
          92%       { opacity: 1; }
          93%       { opacity: 0.4; }
          94%       { opacity: 1; }
          96%       { opacity: 0.6; }
          97%       { opacity: 1; }
        }

        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(20px); }
          to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes glitchX {
          0%, 100% { clip-path: none; transform: none; }
          20%  { clip-path: inset(30% 0 50% 0); transform: translateX(-4px); }
          40%  { clip-path: inset(70% 0 10% 0); transform: translateX(4px); }
          60%  { clip-path: inset(10% 0 80% 0); transform: translateX(-2px); }
          80%  { clip-path: inset(50% 0 30% 0); transform: translateX(3px); }
        }

        @keyframes scan {
          0%   { top: 0;    opacity: 0; }
          5%   { opacity: 0.5; }
          95%  { opacity: 0.5; }
          100% { top: 100%; opacity: 0; }
        }

        @keyframes blink {
          0%, 100% { opacity: 1; }
          50% { opacity: 0; }
        }

        .panel {
          position: relative; width: 460px; background: var(--panel);
          border: 1px solid var(--border); padding: 52px 44px 48px;
          box-shadow:
            0 0 0 1px rgba(255,34,68,0.06),
            0 0 60px rgba(255,34,68,0.1),
            inset 0 1px 0 rgba(255,34,68,0.08);
          animation: fadeIn 0.5s ease both, flicker 8s infinite 1s;
        }

        /* Corner accents */
        .panel::before, .panel::after {
          content: ''; position: absolute; width: 14px; height: 14px;
          border-color: var(--danger); border-style: solid;
        }
        .panel::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
        .panel::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
        .corner-tr, .corner-bl {
          position: absolute; width: 14px; height: 14px;
          border-color: var(--danger); border-style: solid;
        }
        .corner-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
        .corner-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }

        .scanline {
          position: absolute; top: 0; left: 0; right: 0; height: 2px;
          background: linear-gradient(90deg, transparent, var(--danger), transparent);
          opacity: 0; animation: scan 3.5s ease-in-out infinite;
        }

        /* Error code badge */
        .error-code {
          font-size: 10px; letter-spacing: 4px; color: var(--muted);
          text-transform: uppercase; margin-bottom: 16px;
          display: flex; align-items: center; gap: 10px;
        }
        .error-code::before {
          content: ''; display: inline-block; width: 6px; height: 6px;
          border-radius: 50%; background: var(--danger);
          box-shadow: 0 0 8px var(--danger);
          animation: blink 1s step-end infinite;
        }

        /* Big glitch title */
        .title-wrap { position: relative; margin-bottom: 8px; }

        h1 {
          font-family: 'Rajdhani', sans-serif; font-weight: 700;
          font-size: 52px; letter-spacing: 2px; color: var(--danger);
          text-shadow: 0 0 30px var(--danger-mid); text-transform: uppercase;
          line-height: 1; position: relative;
        }

        h1::after {
          content: 'ACCESS DENIED';
          position: absolute; top: 0; left: 0;
          color: var(--danger); opacity: 0.4;
          animation: glitchX 5s infinite 2s;
          pointer-events: none;
        }

        .subtitle {
          font-size: 11px; color: var(--muted); letter-spacing: 2px;
          margin-bottom: 36px; margin-top: 6px;
        }

        .divider {
          height: 1px;
          background: linear-gradient(90deg, var(--danger), transparent);
          margin-bottom: 28px; opacity: 0.3;
        }

        /* Info block */
        .info-block {
          background: var(--danger-dim); border: 1px solid rgba(255,34,68,0.2);
          border-left: 3px solid var(--danger);
          padding: 16px 18px; margin-bottom: 28px;
          font-size: 12px; line-height: 1.8; color: var(--text);
          letter-spacing: 0.5px;
        }

        .info-block .row { display: flex; gap: 12px; }
        .info-block .label { color: var(--muted); min-width: 80px; }
        .info-block .value { color: var(--danger); }

        /* Stack trace style detail */
        .trace {
          font-size: 10px; color: var(--muted); letter-spacing: 1px;
          margin-bottom: 32px; line-height: 2;
          border-top: 1px solid var(--border); padding-top: 16px;
        }
        .trace span { color: rgba(255,34,68,0.5); }

        /* Back button */
        .btn-wrap { display: flex; gap: 12px; }

        button {
          flex: 1; padding: 13px; background: transparent;
          border: 1px solid var(--danger); color: var(--danger);
          font-family: 'Rajdhani', sans-serif; font-weight: 700;
          font-size: 13px; letter-spacing: 3px; text-transform: uppercase;
          cursor: pointer; position: relative; overflow: hidden;
          transition: color 0.25s, box-shadow 0.25s;
        }
        button::before {
          content: ''; position: absolute; inset: 0; background: var(--danger);
          transform: translateX(-100%); transition: transform 0.3s ease; z-index: 0;
        }
        button:hover::before { transform: translateX(0); }
        button:hover { color: var(--bg); box-shadow: 0 0 24px var(--danger-mid); }
        button span { position: relative; z-index: 1; }

        .footer-line {
          margin-top: 28px; font-size: 9px; letter-spacing: 2px;
          color: var(--muted); text-align: center; opacity: 0.5;
        }
    </style>
</head>
<body>

<div class="panel">
    <div class="scanline"></div>
    <div class="corner-tr"></div>
    <div class="corner-bl"></div>

    <div class="error-code">SYS · ERR · 401 · UNAUTHORIZED</div>

    <div class="title-wrap">
        <h1>Access Denied</h1>
    </div>
    <div class="subtitle">Invalid credentials — authentication failed</div>

    <div class="divider"></div>

    <div class="info-block">
        <div class="row"><span class="label">STATUS</span><span class="value">401 UNAUTHORIZED</span></div>
        <div class="row"><span class="label">ENDPOINT</span><span class="value">/ui</span></div>
        <div class="row"><span class="label">METHOD</span><span class="value">POST</span></div>
        <div class="row"><span class="label">REASON</span><span class="value">Password mismatch</span></div>
    </div>

    <div class="trace">
        <span>&gt;</span> AuthFilter.doFilter() — credentials rejected<br/>
        <span>&gt;</span> SecurityContext.clearAuthentication()<br/>
        <span>&gt;</span> Redirected to <span>/error</span>
    </div>

    <div class="btn-wrap">
        <button onclick="history.back()">
            <span>&larr; Try Again</span>
        </button>
    </div>

    <div class="footer-line">SECURE ACCESS CONTROL &middot; v1.0</div>
</div>

</body>
</html>
