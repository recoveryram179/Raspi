<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCP Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap"
          rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:         #0f1117;
            --surface:    #1a1d27;
            --surface-2:  #21242f;
            --border:     rgba(255,255,255,0.08);
            --border-hi:  rgba(255,255,255,0.15);
            --text:       #e8eaf0;
            --muted:      #6b7280;
            --green:      #1D9E75;
            --green-glow: rgba(29,158,117,0.2);
            --green-dim:  rgba(29,158,117,0.12);
            --blue:       #378ADD;
            --blue-dim:   rgba(55,138,221,0.12);
            --red:        #E24B4A;
            --red-dim:    rgba(226,75,74,0.12);
            --amber:      #EF9F27;
            --amber-dim:  rgba(239,159,39,0.10);
            --mono: 'JetBrains Mono', monospace;
            --sans: 'Inter', sans-serif;
        }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .shell {
            width: 100%;
            max-width: 760px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }

        /* ── Title bar ── */
        .titlebar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--surface-2);
        }
        .titlebar-left {
            display: flex; align-items: center; gap: 10px;
        }
        .dots { display: flex; gap: 6px; }
        .dot {
            width: 12px; height: 12px; border-radius: 50%;
        }
        .dot-red   { background: #FF5F57; }
        .dot-amber { background: #FFBD2E; }
        .dot-green { background: #27C93F; }
        .titlebar h1 {
            font-size: 13px; font-weight: 500; color: var(--muted);
            letter-spacing: 0.03em;
        }
        .pills { display: flex; gap: 8px; }
        .pill {
            display: flex; align-items: center; gap: 5px;
            font-size: 11px; font-weight: 500;
            padding: 4px 10px; border-radius: 99px;
            border: 1px solid var(--border);
            color: var(--muted);
            transition: all 0.3s;
        }
        .pill-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--muted); transition: all 0.3s;
        }
        .pill.live { border-color: var(--green); background: var(--green-dim); color: var(--green); }
        .pill.live .pill-dot { background: var(--green); box-shadow: 0 0 0 3px var(--green-glow); }
        .pill.err  { border-color: var(--red); background: var(--red-dim); color: var(--red); }
        .pill.err  .pill-dot { background: var(--red); }

        /* ── Log ── */
        .log {
            height: 400px;
            overflow-y: auto;
            padding: 12px 0;
            scroll-behavior: smooth;
        }
        .log::-webkit-scrollbar { width: 4px; }
        .log::-webkit-scrollbar-track { background: transparent; }
        .log::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 2px; }

        .log-empty {
            height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: var(--muted); gap: 8px;
            font-size: 13px;
        }
        .log-empty svg { opacity: 0.4; }

        .log-row {
            display: flex; align-items: flex-start; gap: 10px;
            padding: 8px 20px;
            border-bottom: 1px solid var(--border);
            animation: fadeSlide 0.18s ease;
            transition: background 0.1s;
        }
        .log-row:hover { background: rgba(255,255,255,0.025); }
        .log-row:last-child { border-bottom: none; }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(5px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .log-time {
            font-family: var(--mono);
            font-size: 11px; color: var(--muted);
            min-width: 56px; padding-top: 2px;
            user-select: none;
        }
        .badge {
            font-size: 10px; font-weight: 500;
            padding: 2px 8px; border-radius: 99px;
            white-space: nowrap; margin-top: 1px;
            min-width: 54px; text-align: center;
            border: 1px solid;
        }
        .badge-web    { background: var(--blue-dim);  color: var(--blue);  border-color: rgba(55,138,221,0.25); }
        .badge-device { background: var(--green-dim); color: var(--green); border-color: rgba(29,158,117,0.25); }
        .badge-sys    { background: rgba(255,255,255,0.05); color: var(--muted); border-color: var(--border); }
        .badge-err    { background: var(--red-dim);   color: var(--red);   border-color: rgba(226,75,74,0.25); }

        .log-text {
            font-family: var(--mono);
            font-size: 12.5px; color: var(--text);
            line-height: 1.55; flex: 1;
            word-break: break-all;
        }
        .log-text.sys { color: var(--muted); font-family: var(--sans); font-size: 13px; }

        /* ── Composer ── */
        .composer {
            display: flex; gap: 8px; align-items: center;
            padding: 14px 20px;
            border-top: 1px solid var(--border);
            background: var(--surface-2);
        }

        .prefix {
            font-family: var(--mono); font-size: 14px; color: var(--green);
            user-select: none;
        }

        #msg-input {
            flex: 1;
            background: transparent;
            border: none; outline: none;
            font-family: var(--mono); font-size: 13px;
            color: var(--text);
            caret-color: var(--green);
        }
        #msg-input::placeholder { color: var(--muted); }

        .composer-actions { display: flex; gap: 6px; }

        .btn {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            height: 36px; padding: 0 16px; border-radius: 8px; border: 1px solid;
            font-size: 13px; font-weight: 500; cursor: pointer;
            transition: all 0.15s;
        }
        .btn-send {
            background: var(--green); border-color: var(--green); color: #fff;
        }
        .btn-send:hover:not(:disabled) { background: #0F6E56; border-color: #0F6E56; }
        .btn-send:active { transform: scale(0.97); }
        .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-icon {
            width: 36px; height: 36px; padding: 0;
            background: transparent; border-color: var(--border);
            color: var(--muted);
        }
        .btn-icon:hover { background: rgba(255,255,255,0.05); border-color: var(--border-hi); color: var(--text); }

        /* ── Footer ── */
        .footer {
            padding: 10px 20px;
            border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .footer-stat { font-size: 11px; color: var(--muted); }
        .footer-url { font-family: var(--mono); font-size: 10px; color: var(--muted); opacity: 0.5; }
    </style>
</head>
<body>

<div class="shell">

    <!-- Title bar -->
    <div class="titlebar">
        <div class="titlebar-left">
            <div class="dots">
                <div class="dot dot-red"></div>
                <div class="dot dot-amber"></div>
                <div class="dot dot-green"></div>
            </div>
            <h1>TCP Monitor — Spring Bridge</h1>
        </div>
        <div class="pills">
            <div class="pill" id="tcp-pill">
                <div class="pill-dot" id="tcp-dot"></div>
                <span id="tcp-label">TCP</span>
            </div>
            <div class="pill" id="ws-pill">
                <div class="pill-dot" id="ws-dot"></div>
                <span id="ws-label">WebSocket</span>
            </div>
        </div>
    </div>

    <!-- Log -->
    <div class="log" id="log">
        <div class="log-empty" id="log-empty">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M8 9h8M8 13h6M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z"/>
            </svg>
            Waiting for connection…
        </div>
    </div>

    <!-- Composer -->
    <div class="composer">
        <span class="prefix">➜</span>
        <input id="msg-input" type="text" placeholder="send a message…" autocomplete="off">
        <div class="composer-actions">
            <button class="btn btn-icon" id="clear-btn" title="Clear log">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6l-1 14H6L5 6"/>
                    <path d="M10 11v6M14 11v6"/>
                    <path d="M9 6V4h6v2"/>
                </svg>
            </button>
            <button class="btn btn-send" id="send-btn" disabled>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
                Send
            </button>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <span class="footer-stat" id="msg-count">0 messages</span>
        <span class="footer-url" id="ws-url"></span>
    </div>

</div>

<script>
    const log       = document.getElementById('log');
    const logEmpty  = document.getElementById('log-empty');
    const msgInput  = document.getElementById('msg-input');
    const sendBtn   = document.getElementById('send-btn');
    const clearBtn  = document.getElementById('clear-btn');
    const wsPill    = document.getElementById('ws-pill');
    const wsLabel   = document.getElementById('ws-label');
    const tcpPill   = document.getElementById('tcp-pill');
    const tcpLabel  = document.getElementById('tcp-label');
    const msgCount  = document.getElementById('msg-count');
    const wsUrl     = document.getElementById('ws-url');

    let count = 0;

    function ts() {
        const d = new Date();
        return [d.getHours(), d.getMinutes(), d.getSeconds()]
            .map(n => String(n).padStart(2, '0')).join(':');
    }

    function addLog(text, type) {
        logEmpty && logEmpty.remove();
        const types = {
            web:    ['Web',    'badge-web'],
            device: ['Device', 'badge-device'],
            sys:    ['System', 'badge-sys'],
            err:    ['Error',  'badge-err'],
        };
        const [label, cls] = types[type] || types.sys;
        const row = document.createElement('div');
        row.className = 'log-row';
        row.innerHTML =
            `<span class="log-time">${ts()}</span>` +
            `<span class="badge ${cls}">${label}</span>` +
            `<span class="log-text${type === 'sys' ? ' sys' : ''}">${escHtml(text)}</span>`;
        log.appendChild(row);
        log.scrollTop = log.scrollHeight;
        if (type !== 'sys') {
            count++;
            msgCount.textContent = count + (count === 1 ? ' message' : ' messages');
        }
    }

    function escHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    /* ── WebSocket ── */
    const WS_URL = `ws://[[${base_url}]]/ws/chat`;
    wsUrl.textContent = WS_URL;

    let socket, reconnectTimer;

    function connect() {
        clearTimeout(reconnectTimer);
        socket = new WebSocket(WS_URL);

        socket.onopen = () => {
            wsPill.className = 'pill live';
            wsLabel.textContent = 'WebSocket live';
            sendBtn.disabled = false;
            addLog('WebSocket connected', 'sys');
            pollTcpStatus();
        };

        socket.onclose = () => {
            wsPill.className = 'pill err';
            wsLabel.textContent = 'WebSocket closed';
            sendBtn.disabled = true;
            tcpPill.className = 'pill';
            tcpLabel.textContent = 'TCP';
            addLog('WebSocket closed — reconnecting in 3 s…', 'err');
            reconnectTimer = setTimeout(connect, 3000);
        };

        socket.onerror = () => {
            wsPill.className = 'pill err';
            wsLabel.textContent = 'WebSocket error';
        };

        socket.onmessage = (e) => {
            addLog(e.data, 'device');
        };
    }

    /* ── TCP status polling ── */
    async function pollTcpStatus() {
        try {
            const res  = await fetch('/tcp/status');
            const data = await res.json();
            if (data.tcpClientConnected) {
                tcpPill.className = 'pill live';
                tcpLabel.textContent = 'TCP connected';
            } else {
                tcpPill.className = 'pill err';
                tcpLabel.textContent = 'TCP: no device';
            }
        } catch (_) {
            tcpPill.className = 'pill';
            tcpLabel.textContent = 'TCP: unknown';
        }
        if (socket && socket.readyState === WebSocket.OPEN) {
            setTimeout(pollTcpStatus, 4000);
        }
    }

    /* ── Send ── */
    function send() {
        const text = msgInput.value.trim();
        if (!text || !socket || socket.readyState !== WebSocket.OPEN) return;
        socket.send(text);
        addLog(text, 'web');
        msgInput.value = '';
        msgInput.focus();
    }

    sendBtn.addEventListener('click', send);
    msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

    /* ── Clear ── */
    clearBtn.addEventListener('click', () => {
        log.innerHTML =
            `<div class="log-empty" id="log-empty">
               <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                 <path d="M8 9h8M8 13h6M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z"/>
               </svg>
               Log cleared
             </div>`;
        count = 0;
        msgCount.textContent = '0 messages';
    });

    connect();
</script>

</body>
</html>
