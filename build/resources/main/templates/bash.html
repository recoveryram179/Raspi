<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@700;800&family=Orbitron:wght@900&display=swap"
          rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
          --bg:       #0a0c0f;
          --surface:  #111418;
          --border:   #1e2530;
          --green:    #00ff88;
          --green-dim:#00cc66;
          --red:      #ff4566;
          --yellow:   #f5c542;
          --muted:    #4a5568;
          --text:     #cdd6e0;
          --mono:     'JetBrains Mono', monospace;
          --display:  'Syne', sans-serif;
        }

        html, body {
          height: 100%;
          overflow: hidden;
        }

        body {
          background: var(--bg);
          color: var(--text);
          font-family: var(--mono);
          display: flex;
          flex-direction: column;
          align-items: center;
          overflow-x: hidden;
        }

        /* scanline overlay */
        body::before {
          content: '';
          pointer-events: none;
          position: fixed;
          inset: 0;
          background: repeating-linear-gradient(
            0deg,
            transparent,
            transparent 2px,
            rgba(0,0,0,0.07) 2px,
            rgba(0,0,0,0.07) 4px
          );
          z-index: 999;
        }

        /* ambient glow */
        body::after {
          content: '';
          pointer-events: none;
          position: fixed;
          top: -20%;
          left: 50%;
          transform: translateX(-50%);
          width: 600px;
          height: 400px;
          background: radial-gradient(ellipse, rgba(0,255,136,0.06) 0%, transparent 70%);
          z-index: 0;
        }

        /* ── top bar (header + url bar) fixed at top ── */
        .topbar {
          position: fixed;
          top: 0;
          left: 0; right: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          z-index: 10;
          background: var(--bg);
          border-bottom: 1px solid var(--border);
        }

        header {
          width: 100%;
          max-width: 900px;
          padding: 0.9rem 1.5rem 0.5rem;
          display: flex;
          align-items: center;
          gap: 1rem;
        }

        .dot-cluster { display: flex; gap: 6px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot.red    { background: #ff5f57; }
        .dot.yellow { background: #febc2e; }
        .dot.green  { background: #28c840; }

        .title {
          font-family: var(--display);
          font-size: 0.85rem;
          font-weight: 800;
          letter-spacing: 0.25em;
          text-transform: uppercase;
          color: var(--muted);
          margin-left: auto;
        }
        .title span { color: var(--green); }

        /* url bar inside topbar */
        .url-bar {
          width: 100%;
          max-width: 900px;
          padding: 0.4rem 1.5rem 0.65rem;
          display: flex;
          align-items: center;
          gap: 0.75rem;
        }
        .url-label {
          font-size: 0.7rem;
          color: var(--muted);
          white-space: nowrap;
          letter-spacing: 0.05em;
          text-transform: uppercase;
        }
        #base-url {
          flex: 1;
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 4px;
          padding: 0.4rem 0.75rem;
          color: var(--yellow);
          font-family: var(--mono);
          font-size: 0.78rem;
          outline: none;
          transition: border-color 0.2s;
        }
        #base-url:focus { border-color: var(--yellow); }

        .clear-btn {
          background: transparent;
          border: 1px solid var(--border);
          border-radius: 4px;
          padding: 0.4rem 0.75rem;
          color: var(--muted);
          font-family: var(--mono);
          font-size: 0.72rem;
          cursor: pointer;
          transition: color 0.15s, border-color 0.15s;
          white-space: nowrap;
        }
        .clear-btn:hover { color: var(--red); border-color: var(--red); }

        /* ── scrollable log ── */
        #log {
          position: fixed;
          top: var(--topbar-h, 110px);
          bottom: var(--bottombar-h, 58px);
          left: 0; right: 0;
          overflow-y: auto;
          padding: 1.25rem 1.5rem;
          display: flex;
          flex-direction: column;
          gap: 1.25rem;
          scroll-behavior: smooth;
          /* center content up to 900px */
          max-width: 900px;
          margin: 0 auto;
          width: 100%;
        }

        /* welcome message */
        .welcome {
          color: var(--muted);
          font-size: 0.78rem;
          line-height: 1.8;
          border-left: 2px solid var(--border);
          padding-left: 1rem;
        }
        .welcome-title {
          font-family: 'Orbitron', sans-serif;
          font-size: 2.8rem;
          font-weight: 900;
          color: var(--green);
          letter-spacing: 0.18em;
          text-transform: uppercase;
          margin-bottom: 0.75rem;
          text-shadow:
            0 0 10px rgba(0,255,136,0.7),
            0 0 30px rgba(0,255,136,0.35),
            0 0 70px rgba(0,255,136,0.15);
          line-height: 1;
        }

        /* each entry */
        .entry { display: flex; flex-direction: column; gap: 0.5rem; }

        .cmd-line {
          display: flex;
          align-items: flex-start;
          gap: 0.6rem;
          font-size: 0.85rem;
        }
        .prompt { color: var(--green); white-space: nowrap; user-select: none; }
        .cmd-text { color: #fff; word-break: break-all; }

        .output-block {
          background: rgba(0,0,0,0.35);
          border-left: 2px solid var(--green-dim);
          padding: 0.75rem 1rem;
          font-size: 0.8rem;
          line-height: 1.7;
          color: var(--text);
          white-space: pre-wrap;
          word-break: break-all;
          border-radius: 0 4px 4px 0;
          animation: fadeSlide 0.2s ease;
        }
        .output-block.error {
          border-left-color: var(--red);
          color: var(--red);
        }
        .output-block.info {
          border-left-color: var(--yellow);
          color: var(--yellow);
        }

        @keyframes fadeSlide {
          from { opacity: 0; transform: translateY(4px); }
          to   { opacity: 1; transform: translateY(0); }
        }

        /* spinner */
        .spinner {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          font-size: 0.75rem;
          color: var(--muted);
        }
        .spinner-dots span {
          display: inline-block;
          width: 5px; height: 5px;
          border-radius: 50%;
          background: var(--green);
          animation: blink 1s infinite;
        }
        .spinner-dots span:nth-child(2) { animation-delay: 0.2s; }
        .spinner-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink {
          0%,80%,100% { opacity: 0.2; }
          40%          { opacity: 1; }
        }

        /* ── fixed bottom input bar ── */
        .bottom-bar {
          position: fixed;
          bottom: 0;
          left: 0; right: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          z-index: 10;
          background: var(--bg);
          border-top: 1px solid var(--border);
        }

        .input-bar {
          width: 100%;
          max-width: 900px;
          background: var(--surface);
          border-top: 2px solid var(--green-dim);
          padding: 0.75rem 1rem;
          display: flex;
          align-items: center;
          gap: 0.75rem;
          transition: border-color 0.2s;
        }
        .input-bar:focus-within {
          border-top-color: var(--green);
          box-shadow: 0 -4px 20px rgba(0,255,136,0.06);
        }

        .input-prompt {
          color: var(--green);
          font-size: 0.9rem;
          white-space: nowrap;
          user-select: none;
        }

        #cmd-input {
          flex: 1;
          background: transparent;
          border: none;
          outline: none;
          color: #fff;
          font-family: var(--mono);
          font-size: 0.9rem;
          caret-color: var(--green);
        }
        #cmd-input::placeholder { color: var(--muted); }

        #send-btn {
          background: var(--green);
          color: #000;
          border: none;
          border-radius: 4px;
          padding: 0.45rem 1.1rem;
          font-family: var(--display);
          font-size: 0.78rem;
          font-weight: 800;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          cursor: pointer;
          transition: background 0.15s, transform 0.1s;
          white-space: nowrap;
        }
        #send-btn:hover  { background: #00ffaa; }
        #send-btn:active { transform: scale(0.96); }
        #send-btn:disabled {
          background: var(--muted);
          cursor: not-allowed;
          transform: none;
        }

        .history-tip {
          font-size: 0.6rem;
          color: var(--muted);
          padding: 0.25rem 1rem 0.35rem;
          align-self: flex-start;
          padding-left: calc((100% - 900px) / 2 + 1rem);
        }
    </style>
</head>
<body>

<!-- Fixed top bar -->
<div class="topbar" id="topbar">
    <header>
        <div class="dot-cluster">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
        </div>
        <div class="title">TERMINAL <span>Runner</span></div>
    </header>
    <div class="url-bar">
        <span class="url-label">API Base</span>
        <input id="base-url" type="text" th:value="${url}" th:placeholder="${url}" spellcheck="false"/>
        <button class="clear-btn" onclick="clearLog()">Clear Log</button>
    </div>
</div>

<!-- Scrollable output log -->
<div id="log">
    <div class="welcome">
        <div class="welcome-title">Terminal</div>
        Type a shell command and press <span style="color:var(--green)">ENTER</span> or click <span
            style="color:var(--green)">RUN</span>.<br/>
        Use <span style="color:var(--yellow)">↑ / ↓</span> to navigate history.<br/>
        Works on both <span style="color:var(--green)">Linux</span> and <span style="color:var(--yellow)">Windows</span>
        — set your API base URL above.<br/>
        For command separation use <span style="color:var(--yellow)">;</span> or <span
            style="color:var(--yellow)">&&</span>.
    </div>
</div>

<!-- Fixed bottom input bar -->
<div class="bottom-bar" id="bottombar">
    <div class="input-bar">
        <span class="input-prompt">❯&nbsp;</span>
        <input id="cmd-input" type="text" placeholder="ls -la  /  dir  /  echo hello  /  whoami ..." autocomplete="off"
               spellcheck="false"/>
        <button id="send-btn" onclick="runCommand()">Run</button>
    </div>
    <div class="history-tip">↑ ↓ history &nbsp;·&nbsp; Enter to run</div>
</div>

<script>
    const log       = document.getElementById('log');
    const input     = document.getElementById('cmd-input');
    const sendBtn   = document.getElementById('send-btn');
    const baseUrlEl = document.getElementById('base-url');
    const topbar    = document.getElementById('topbar');
    const bottombar = document.getElementById('bottombar');

    // Dynamically measure fixed bars and set log offsets
    function measureBars() {
      const th = topbar.offsetHeight;
      const bh = bottombar.offsetHeight;
      log.style.top    = th + 'px';
      log.style.bottom = bh + 'px';
    }
    measureBars();
    window.addEventListener('resize', measureBars);

    let cmdHistory = [];
    let histIdx    = -1;

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { runCommand(); return; }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (cmdHistory.length === 0) return;
        histIdx = Math.min(histIdx + 1, cmdHistory.length - 1);
        input.value = cmdHistory[histIdx];
      }
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        histIdx = Math.max(histIdx - 1, -1);
        input.value = histIdx === -1 ? '' : cmdHistory[histIdx];
      }
    });

    async function runCommand() {
      const cmd = input.value.trim();
      if (!cmd) return;

      cmdHistory.unshift(cmd);
      if (cmdHistory.length > 100) cmdHistory.pop();
      histIdx = -1;

      input.value = '';
      sendBtn.disabled = true;

      const entry = document.createElement('div');
      entry.className = 'entry';
      entry.innerHTML = `
        <div class="cmd-line">
          <span class="prompt">❯</span>
          <span class="cmd-text">${escHtml(cmd)}</span>
        </div>`;

      const spinnerEl = document.createElement('div');
      spinnerEl.className = 'spinner';
      spinnerEl.innerHTML = `<div class="spinner-dots"><span></span><span></span><span></span></div><span>executing...</span>`;
      entry.appendChild(spinnerEl);
      log.appendChild(entry);
      scrollBottom();

      const baseUrl = baseUrlEl.value.replace(/\/$/, '');

      try {
        const res = await fetch(baseUrl, {
          method : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body   : JSON.stringify({ cmd })
        });

        spinnerEl.remove();

        if (!res.ok) {
          let errText;
          try { errText = await res.text(); } catch { errText = res.statusText; }
          appendBlock(entry, errText || `HTTP ${res.status}`, 'error');
        } else {
          const data = await res.json();
          if (data.output) appendBlock(entry, data.output, 'output');
          if (data.error)  appendBlock(entry, data.error,  'error');
          if (!data.output && !data.error) appendBlock(entry, '(no output)', 'info');
        }
      } catch (err) {
        spinnerEl.remove();
        appendBlock(entry, `Network error: ${err.message}`, 'error');
      }

      sendBtn.disabled = false;
      scrollBottom();
      input.focus();
    }

    function appendBlock(entry, text, type) {
      const block = document.createElement('div');
      block.className = `output-block ${type === 'output' ? '' : type}`;
      block.textContent = text.trimEnd();
      entry.appendChild(block);
    }

    function scrollBottom() {
      log.scrollTo({ top: log.scrollHeight, behavior: 'smooth' });
    }

    function clearLog() {
      log.innerHTML = `<div class="welcome" style="color:var(--muted);font-size:0.78rem">Log cleared.</div>`;
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    input.focus();
</script>
</body>
</html>
